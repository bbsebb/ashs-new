name: build-and-push-and-deploy-prod.yml
on:
  push:
    tags:
      - 'v*' # Se déclenche uniquement sur les tags commençant par 'v' (ex: v1.0.0, v2.1.3)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # --- ÉTAPES DE BUILD (Identiques au staging) ---
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x backend/gradlew

      - name: Build with Gradle
        working-directory: backend
        run: ./gradlew bootJar -x test

      - name: Create Backend Dockerfile
        working-directory: backend
        run: |
          cat <<EOF > Dockerfile
          FROM eclipse-temurin:25-jre-jammy
          WORKDIR /app
          RUN apt-get update && apt-get install -y wget && rm -rf /var/lib/apt/lists/*
          COPY build/libs/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:all

      - name: Create Dockerfiles & Nginx configs for Angular apps
        working-directory: frontend
        run: |
          cat <<'EOF' > nginx.app.conf
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
          
            location / {
              try_files $uri $uri/ /index.html;
            }
          }
          EOF
          
          cat <<'EOF' > nginx.admin.conf
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
          
            location / {
              try_files $uri $uri/ /index.html;
            }
          }
          EOF
          
          cat <<'EOF' > Dockerfile.app
          FROM nginx:alpine
          COPY dist/app/browser /usr/share/nginx/html
          COPY nginx.app.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          EOF
          
          cat <<'EOF' > Dockerfile.admin
          FROM nginx:alpine
          COPY dist/admin/browser /usr/share/nginx/html
          COPY nginx.admin.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          EOF

      # --- CONNEXION ET PUSH (Adaptés pour les tags) ---
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PUSH BACKEND
      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      # PUSH FRONTEND APP
      - name: Build and push Angular APP image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-app:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-app:${{ github.ref_name }}

      # PUSH FRONTEND ADMIN
      - name: Build and push Angular ADMIN image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.admin
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-admin:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-admin:${{ github.ref_name }}

  deploy:
    needs: build-and-push # S'assure que le déploiement ne se lance que si le build réussit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Génération dynamique du fichier .env
      - name: Create .env file
        run: |
          cat <<EOF > deployment/.env
          PAGE_ACCESS_TOKEN=${{ secrets.PAGE_ACCESS_TOKEN }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_USERNAME=${{ vars.MAIL_USERNAME }}
          APP_CORS_ALLOWED_ORIGINS=${{ vars.APP_CORS_ALLOWED_ORIGINS }}
          SPRING_DATASOURCE_URL=${{ vars.DB_URL }}
          SPRING_DATASOURCE_USERNAME=${{ vars.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
          IMAGE_TAG=${{ github.ref_name }}
          EOF

      # Copie du dossier deployment vers le VPS
      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deployment/docker-compose.prod.yml,deployment/.env"
          target: "/home/ashs-app" # Remplace par le chemin de ton choix sur ton VPS
          strip_components: 1 # Retire le dossier 'deployment/' pour mettre les fichiers directement dans /opt/ashs-app

      # Connexion SSH et lancement des conteneurs
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/ashs-app
            # Connexion au registre GitHub depuis le VPS pour pouvoir pull les images privées
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Renomme le fichier docker-compose pour simplifier la commande
            mv docker-compose.prod.yml docker-compose.yml
            
            # Pull des nouvelles images (tagguées avec la version actuelle grâce au .env)
            docker compose pull
            
            # Recréation des conteneurs en tâche de fond
            docker compose up -d
            
            # Nettoyage des anciennes images inutilisées pour libérer de l'espace
            docker image prune -af
