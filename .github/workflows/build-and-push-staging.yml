name: CI/CD - Dynamic Dockerfile and Compose

on:
  push:
    branches: [ "staging" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x backend/gradlew

      # 1. Build du JAR avec Gradle (dans backend/)
      - name: Build with Gradle
        working-directory: backend
        run: ./gradlew bootJar -x test

      # 2. Création dynamique du Dockerfile (dans backend/)
      - name: Create Dockerfile
        working-directory: backend
        run: |
          cat <<EOF > Dockerfile
          FROM eclipse-temurin:25-jre-jammy
          WORKDIR /app
          RUN apt-get update && \
            apt-get install -y wget && \
            rm -rf /var/lib/apt/lists/*
          COPY build/libs/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF
      # 2bis. Build des frontends Angular (dans frontend/)
      - name: Set up Node.js (npm)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular (shared-ui + app + admin)
        working-directory: frontend
        run: npm run build:all

      - name: Create Dockerfiles for Angular apps
        working-directory: frontend
        run: |
          # Nginx config: SPA fallback (Angular Router deep links)
          cat <<'EOF' > nginx.app.conf
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
          
            location / {
              try_files $uri $uri/ /index.html;
            }
          }
          EOF
          
          cat <<'EOF' > nginx.admin.conf
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
          
            location / {
              try_files $uri $uri/ /index.html;
            }
          }
          EOF
          
          cat <<'EOF' > Dockerfile.app
          FROM nginx:alpine
          COPY dist/app/browser /usr/share/nginx/html
          COPY nginx.app.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          EOF
          
          cat <<'EOF' > Dockerfile.admin
          FROM nginx:alpine
          COPY dist/admin/browser /usr/share/nginx/html
          COPY nginx.admin.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          EOF

      # 3. Connexion au GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build et Push de l'image (contexte = backend/)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 4bis. Build et Push des images frontends (contexte = frontend/)
      - name: Build and push Angular APP image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-app:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-app:${{ github.sha }}

      - name: Build and push Angular ADMIN image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.admin
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-admin:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-admin:${{ github.sha }}

