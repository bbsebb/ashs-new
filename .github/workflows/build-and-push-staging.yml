name: CI/CD - Dynamic Dockerfile and Compose

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x backend/gradlew

      # 1. Build du JAR avec Gradle (dans backend/)
      - name: Build with Gradle
        working-directory: backend
        run: ./gradlew bootJar -x test

      # 2. Création dynamique du Dockerfile (dans backend/)
      - name: Create Dockerfile
        working-directory: backend
        run: |
          cat <<EOF > Dockerfile
          FROM eclipse-temurin:25-jre-jammy
          WORKDIR /app
          COPY build/libs/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF

      # 3. Connexion au GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build et Push de l'image (contexte = backend/)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 5. Création du docker-compose.yml dans staging/
      - name: Generate Deployment Package
        run: |
          mkdir -p staging
          LOWER_IMAGE_NAME=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URL="${LOWER_IMAGE_NAME}:${{ github.sha }}"

          cat <<EOF > staging/docker-compose.yml
          version: '3.8'
          services:
            app:
              image: ${IMAGE_URL}
              container_name: spring-app-staging
              ports:
                - "8080:8080"
              environment:
                - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/myapp
                - SPRING_DATASOURCE_USERNAME=<db_user>
                - SPRING_DATASOURCE_PASSWORD=<db_password>
                - SPRING_FLYWAY_ENABLED=true
              depends_on:
                db:
                  condition: service_healthy

            db:
              image: postgres:latest
              container_name: postgres-db-staging
              environment:
                - POSTGRES_DB=myapp
                - POSTGRES_USER=<db_user>
                - POSTGRES_PASSWORD=<db_password>
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U <db_user> -d myapp"]
                interval: 5s
                timeout: 5s
                retries: 5
          EOF

      # 6. Upload du package de déploiement
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: staging-deployment-files
          path: staging/