spring:
  config:
    activate:
      on-profile: dev

  docker:
    compose:
      enabled: true
      file: ./backend/compose.yaml

  flyway:
    clean-disabled: false
    validate-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # L'URL exacte de ton Realm Keycloak
          issuer-uri: http://localhost:8081/realms/ashs

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.results: TRACE
    fr.hoenheimsports: DEBUG