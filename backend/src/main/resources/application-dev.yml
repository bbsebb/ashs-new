spring:
  config:
    activate:
      on-profile: dev

  docker:
    compose:
      enabled: true
      file: ./backend/compose.yaml

  flyway:
    enabled: true
    create-schemas: true
    clean-disabled: false
    validate-on-migrate: false

contact:
  administrator:
    email:
      address: sebastien.burckhardt@hoenheimsports.fr

management:
  tracing:
    sampling:
      probability: 1.0


logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    fr.hoenheimsports: TRACE