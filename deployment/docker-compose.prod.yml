# deployment/docker-compose.prod.yml

services:
  # 1. Base de données
  db:
    image: postgres:latest
    container_name: postgres-db-prod
    restart: always # 'always' est souvent préféré en prod pour relancer même après un crash inattendu
    environment:
      - POSTGRES_DB=ashs_db
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - db-data-prod:/var/lib/postgresql/data # Chemin officiel recommandé par l'image Postgres
    networks:
      - ashs-network
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2. Backend (Spring Boot)
  app:
    image: ghcr.io/bbsebb/ashs-new:${IMAGE_TAG}
    container_name: spring-app-prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod # Changé de staging à prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - PAGE_ACCESS_TOKEN=${PAGE_ACCESS_TOKEN}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - RESOURCE_SERVER_ISSUER_URI=${RESOURCE_SERVER_ISSUER_URI}
      - SPRING_FLYWAY_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=ashs-backend
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
    volumes:
      - ./uploads:/app/uploads
    networks:
      - observability-network
      - ashs-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # 3. Frontends
  frontend-app:
    image: ghcr.io/bbsebb/ashs-new-frontend-app:${IMAGE_TAG}
    container_name: angular-app-prod
    restart: always
    ports:
      - "4200:80" # App principale
    networks:
      - ashs-network
    depends_on:
      - app

  frontend-admin:
    image: ghcr.io/bbsebb/ashs-new-frontend-admin:${IMAGE_TAG}
    container_name: angular-admin-prod
    restart: always
    ports:
      - "4201:80" # App Admin
    networks:
      - ashs-network
    depends_on:
      - app

# Définition de l'infrastructure Docker
networks:
  observability-network:
    external: true
  ashs-network:
    driver: bridge

volumes:
  db-data-prod:
    name: ashs_db_data_prod