<mat-form-field>
  <mat-label>Saison sélectionnée</mat-label>
  <mat-select [ngModel]="selected" (selectionChange)="onChange($event)">
    @for (season of seasons(); track season.id) {
      <mat-option [value]="season">{{ season.name }}</mat-option>
    }
    <mat-option [value]="null" (click)="addSeason()">
      Ajouter une saison
    </mat-option>
  </mat-select>
</mat-form-field>
