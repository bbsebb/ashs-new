@let hall = hallSignal();
@if(isLoading()) {
  <app-loading-data label="Chargement de la salle" [isLoading]="isLoading()" />
} @else if(error()) {
  <app-error-data dataName="salles" (onRetry)="retry()" />
} @else if (!hall) {
  <p>Aucune salle</p>
} @else {
  <app-hall-card [hall]="hall"></app-hall-card>
}
