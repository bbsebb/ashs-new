@let season = seasonSignal();
<mat-card class="card" appearance="outlined">
  <mat-card-header class="header">
    <mat-card-title class="title">{{ season.name }}</mat-card-title>

    <mat-chip-set aria-label="Statut de la saison">
      @if (season.isActive) {
        <mat-chip class="status status-active">Active</mat-chip>
      } @else {
        <mat-chip class="status">Inactive</mat-chip>
      }
      @if (season.isCurrent) {
        <mat-chip class="status status-active">En cours</mat-chip>
      }
    </mat-chip-set>
  </mat-card-header>

  <mat-card-content class="content">
    <dl class="meta">
      <div class="row">
        <dt>Début</dt>
        <dd>{{ season.startDate | date : 'dd/MM/yyyy' }}</dd>
      </div>

      <div class="row">
        <dt>Fin</dt>
        <dd>{{ season.endDate | date : 'dd/MM/yyyy' }}</dd>
      </div>
    </dl>
  </mat-card-content>
  @if (withActions()) {
    <mat-card-actions align="end">
      <button mat-button type="button" routerLink="/seasons">Retour</button>
      <button mat-flat-button type="button" routerLink="/seasons/{{season.id}}/update">Modifier</button>
      <app-form-delete-button
        confirmMessage="Êtes-vous sûr de vouloir supprimer cette saison ?"
        (deleteConfirmed)="onDelete()">
      </app-form-delete-button>
    </mat-card-actions>
  }
</mat-card>
