@let season = seasonSignal();
@if(isLoadingSignal()) {
  <app-loading-data label="Chargement de la salle" [isLoading]="isLoadingSignal()" />
} @else if(errorSignal()) {
  <app-error-data dataName="saisons" (onRetry)="retry()" />
} @else if (!season) {
  <p>Aucune salle</p>
} @else {
  <app-season-card [season]="season" ></app-season-card>
}
