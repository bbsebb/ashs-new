@let staff = staffSignal();
@if (isLoading()) {
  <app-loading-data label="Chargement du membre de l'encadrement" [isLoading]="isLoading()"/>
} @else if (error()) {
  <app-error-data dataName="encadrant" (onRetry)="retry()"/>
} @else if (!staff) {
  <p>Aucun membre de l'encadrement trouvé</p>
} @else {
  <app-staff-card [staff]="staff"></app-staff-card>
}
