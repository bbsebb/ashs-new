@let team = teamSignal();
@if(isLoading()) {
  <app-loading-data label="Chargement de l'équipe" [isLoading]="isLoading()" />
} @else if(error()) {
  <app-error-data dataName="équipes" (onRetry)="retry()" />
} @else if (!team) {
  <p>Aucune équipe</p>
} @else {
  <app-team-card [team]="team"></app-team-card>
}
