@let viewModel = hallCardViewModelSignal();

<!-- Loading State View -->
@if(isLoadingSignal()) {
  <app-loading-data label="Chargement de la salle" [isLoading]="isLoadingSignal()"/>
}
@else if (errorSignal()) {
  <app-error-data dataName="salles" (onRetry)="retry()" />
} @else if (!viewModel) {
  <p>Aucune salle</p>
}
@else {
  <lib-hall-card [hallCardViewModel]="viewModel">
    <mat-card-actions actions align="end">
      <!-- Navigation and Management Actions -->
      <button mat-button type="button" routerLink="/halls">Retour</button>
      <button mat-flat-button type="button" routerLink="/halls/{{viewModel.id}}/update">Modifier</button>
      <app-form-delete-button
        confirmMessage="Êtes-vous sûr de vouloir supprimer cette salle ?"
        (deleteConfirmed)="onDelete()">
      </app-form-delete-button>
    </mat-card-actions>
  </lib-hall-card>
}
