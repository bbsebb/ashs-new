@if (isLoadingSignal()) {
  <app-loading-data label="Chargement des salles"/>
} @else if (errorSignal()) {
  <app-error-data dataName="salles" (onRetry)="retry()"/>
} @else {
  <app-admin-page-container title="Salles" subtitle="Gestion des salles">
    <a mat-fab extended color="primary" routerLink="/halls/create" aria-label="Ajouter une salle" header-actions>
      <mat-icon>add</mat-icon>
      Ajouter
    </a>

    <div class="table-container">
      <table mat-table [dataSource]="dataSource" matSort>


        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Nom</th>
          <td mat-cell *matCellDef="let hall" data-label="Nom"> {{ hall.name }}</td>
        </ng-container>

        <ng-container matColumnDef="addressStreet">
          <th mat-header-cell *matHeaderCellDef> Adresse</th>
          <td mat-cell *matCellDef="let hall" data-label="Adresse"> {{ hall.addressStreet }}</td>
        </ng-container>

        <ng-container matColumnDef="addressCity">
          <th mat-header-cell *matHeaderCellDef> Ville</th>
          <td mat-cell *matCellDef="let hall" data-label="Ville"> {{ hall.addressCity }}</td>
        </ng-container>

        <ng-container matColumnDef="addressPostalCode">
          <th mat-header-cell *matHeaderCellDef> Code postal</th>
          <td mat-cell *matCellDef="let hall" data-label="Code postal"> {{ hall.addressPostalCode }}</td>
        </ng-container>

        <ng-container matColumnDef="addressCountry">
          <th mat-header-cell *matHeaderCellDef> Pays</th>
          <td mat-cell *matCellDef="let hall" data-label="Pays"> {{ hall.addressCountry }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions</th>
          <td mat-cell *matCellDef="let hall" data-label="Actions">
            <button mat-icon-button type="button" aria-label="Modifier" routerLink="/halls/{{hall.id}}">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button type="button" aria-label="Modifier" routerLink="/halls/{{hall.id}}/update">
              <mat-icon>edit</mat-icon>
            </button>

            <app-form-delete-button
              confirmMessage="Êtes-vous sûr de vouloir supprimer cette salle ?"
              [iconOnly]="true"
              (deleteConfirmed)="onDelete(hall.id)">
            </app-form-delete-button>
          </td>
        </ng-container>

        <!-- Table Row Definitions -->
        <tr mat-header-row *matHeaderRowDef="displayedColumnsSignal()"></tr>
        <tr mat-row *matRowDef="let _; columns: displayedColumnsSignal();"></tr>

        <!-- No Data Row -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumnsSignal().length">
            Aucune salle à afficher.
          </td>
        </tr>
      </table>

      <!-- Paginator -->
      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
  </app-admin-page-container>
}
