@let season = seasonSignal();
@if(isLoadingSignal()) {
  <app-loading-data label="Chargement de la salle" [isLoadingSignal]="isLoadingSignal()"/>
} @else if(errorSignal()) {
  <app-error-data dataName="saisons" (onRetry)="retry()" />
} @else if (!season) {
  <p>Aucune salle</p>
} @else {
  <lib-season-card [season]="season">
    <mat-card-actions actions align="end">
      <button mat-button type="button" routerLink="/seasons">Retour</button>
      <button mat-flat-button type="button" routerLink="/seasons/{{season.id}}/update">Modifier</button>
      <app-form-delete-button
        confirmMessage="Êtes-vous sûr de vouloir supprimer cette saison ?"
        (deleteConfirmed)="onDelete()">
      </app-form-delete-button>
    </mat-card-actions>
  </lib-season-card>
}
