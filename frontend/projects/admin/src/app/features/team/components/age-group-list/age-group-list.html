@if (isLoadingSignal()) {
  <app-loading-data label="Chargement des catégories"></app-loading-data>
} @else if (errorSignal()) {
  <app-error-data (onRetry)="reload()" dataName="Catégorie"></app-error-data>
} @else {
  <div class="table-toolbar">
    <app-page-title title="Catégorie" subtitle="Gestion des catégories"/>
    <a mat-fab extended routerLink="/age-groups/create" aria-label="Ajouter une catégorie">
      <mat-icon>add</mat-icon>
      Ajouter
    </a>
  </div>
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Catégorie</th>
        <td mat-cell *matCellDef="let ageGroup" data-label="Catégorie">
          {{ ageGroup.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions</th>
        <td mat-cell *matCellDef="let team" data-label="Actions">
          <app-form-delete-button
            confirmMessage="Êtes-vous sûr de vouloir supprimer cette équipe ?"
            [iconOnly]="true"
            (deleteConfirmed)="onDelete(team.id)">
          </app-form-delete-button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let _; columns: displayedColumns();"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns().length">
          Aucune équipe à afficher.
        </td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="20" showFirstLastButtons></mat-paginator>
  </div>
}
