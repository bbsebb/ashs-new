@let team = teamSignal();
@if(isLoadingSignal()) {
  <app-loading-data label="Chargement de l'équipe" [isLoadingSignal]="isLoadingSignal()"/>
} @else if(errorSignal()) {
  <app-error-data dataName="équipes" (onRetry)="retry()" />
} @else if (!team) {
  <p>Aucune équipe</p>
} @else {
  <lib-team-card [team]="team">
    <mat-card-actions actions align="end">
      <button mat-button routerLink="/teams">Retour</button>
      <div class="spacer"></div>
      <button mat-icon-button color="primary" routerLink="/teams/{{team.id}}/update" aria-label="Modifier">
        <mat-icon>edit</mat-icon>
      </button>
      <app-form-delete-button
        confirmMessage="Êtes-vous sûr de vouloir supprimer cette équipe ?"
        [iconOnly]="true"
        (deleteConfirmed)="onDelete()">
      </app-form-delete-button>
    </mat-card-actions>
  </lib-team-card>
}
