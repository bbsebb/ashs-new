<!--
  Main container for the image cropper tool.
  Provides file selection, updateing area, and preview.
-->
<div class="image-cropper-container">

  <!-- Action bar containing the file selection button -->
  <div class="actions-bar">
    <button mat-stroked-button type="button" (click)="fileInput.click()" aria-label="Sélectionner une image">
      <mat-icon fontIcon="upload_file"></mat-icon>
      Sélectionner une image
    </button>
    <!-- Hidden file input triggered by the button above -->
    <input #fileInput type="file" accept="image/*" (change)="onImageFileSelected($event)" hidden/>
  </div>

  <div class="image-cropper-layout">

    <!-- Primary crop updateing section -->
    <div class="crop-section">
      <h3>Éditeur</h3>
      <app-image-cropper-view
        [selectedImageSource]="selectedImageUrlSignal()"
        [cropMaskWidth]="cropMaskWidthInputSignal()"
        [cropMaskHeight]="effectiveHeightSignal()"
        [isCircular]="isCircularInputSignal()"
        (cropGeometryChange)="updateCropGeometry($event)">
      </app-image-cropper-view>
    </div>
    @if (withPreviewInputSignal()) {
      <!-- Live preview section showing the cropped result -->
      <app-image-cropper-preview
        [previewBlob]="croppedBlobResource.value()"
        [isError]="!!croppedBlobResource.error()"
        [isLoading]="croppedBlobResource.isLoading()"
        [previewWidth]="cropMaskWidthInputSignal()"
        [previewHeight]="effectiveHeightSignal()"
        [isCircular]="isCircularInputSignal()">
      </app-image-cropper-preview>
    }
  </div>
</div>
