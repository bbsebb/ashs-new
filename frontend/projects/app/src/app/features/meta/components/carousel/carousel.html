<div
  class="carousel"
  tabindex="0"
  role="region"
  aria-roledescription="carousel"
  aria-label="Galerie"
>
  @for (subAttachment of subAttachmentsSignal(); let i = $index; track subAttachment.url) {
    @if (i === 0) {
      <app-media
        [class.active]="!!currentSubAttachmentSignal() && subAttachment.url === currentSubAttachmentSignal()!.url"
        [type]="subAttachment.type"
        [media]="subAttachment.media"
        [priority]="true">
      </app-media>
    } @else {
      <app-media
        [class.active]="!!currentSubAttachmentSignal() && subAttachment.url === currentSubAttachmentSignal()!.url"
        [type]="subAttachment.type"
        [media]="subAttachment.media">
      </app-media>
    }
  }
  <button
    mat-icon-button
    class="carousel-control prev"
    (click)="prevSlide()"
    [disabled]="!canNavigateSignal()"
    aria-label="Média précédent">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <button
    mat-icon-button
    class="carousel-control next"
    (click)="nextSlide()"
    [disabled]="!canNavigateSignal()"
    aria-label="Média suivant">
    <mat-icon>arrow_forward</mat-icon>
  </button>
</div>
