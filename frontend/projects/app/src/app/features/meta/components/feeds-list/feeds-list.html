@if (isLoadingSignal()) {
  <app-loading-data />
} @else if (errorSignal()) {
  <app-error-data dataName="médias" (onRetry)="retry()"   />
} @else {
  <div class="feeds-container">
    @for (feed of feedsSignal(); track feed.id) {
      <app-feed [feed]="feed"></app-feed>
    } @empty {
      <p>Aucun média actuellement</p>
    }
  </div>
}
