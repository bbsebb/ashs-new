<!-- Container for the admin page layout -->
<div class="admin-page-container">
  <!-- Header section containing the title and actions -->
  <div class="page-header">
    <app-page-title
      [title]="titleInputSignal()"
      [subtitle]="subtitleInputSignal()"
      [eyebrow]="eyebrowInputSignal()"
    />
    <!-- Slot for additional actions (e.g., buttons) in the header -->
    <div class="header-actions">
      <ng-content select="[header-actions]"></ng-content>
    </div>
  </div>

  <!-- Main content area -->
  <main class="page-content">
    <ng-content></ng-content>
  </main>
</div>
