@let viewModel = contactViewModelInputSignal();
<section class="form">
  <app-page-title
    [eyebrow]="viewModel.eyebrow"
    [title]="viewModel.title"
    [subtitle]="viewModel.subtitle"
  />

  <form class="content" autocomplete="off" (submit)="onSubmitForm($event); $event.preventDefault()">
    <div class="form-fields">
      <mat-form-field class="field field-full" appearance="outline">
        <mat-label>Votre email</mat-label>
        <input matInput type="email" [formField]="contactFormSignal.from" autocomplete="email"/>
        <mat-error *appError="contactFormSignal.from; let errorMsg">
          {{ errorMsg }}
        </mat-error>
      </mat-form-field>

      <mat-form-field class="field field-full" appearance="outline">
        <mat-label>Sujet</mat-label>
        <input matInput type="text" [formField]="contactFormSignal.subject" autocomplete="off"/>
        <mat-error *appError="contactFormSignal.subject; let errorMsg">
          {{ errorMsg }}
        </mat-error>
      </mat-form-field>

      <mat-form-field class="field field-full" appearance="outline">
        <mat-label>Message</mat-label>
        <textarea
          matInput
          rows="6"
          [formField]="contactFormSignal.content"
          autocomplete="off"
        ></textarea>
        <mat-error *appError="contactFormSignal.content; let errorMsg">
          {{ errorMsg }}
        </mat-error>
      </mat-form-field>
    </div>

    @let globalErrors = contactFormSignal().errors();
    @if (globalErrors.length > 0) {
      @for (globalError of globalErrors; track globalError.kind) {
        <mat-error class="alert alert-danger">
          {{ globalError.message }}
        </mat-error>
      }
    }

    <div class="actions">
      <app-form-submit-button
        [disabled]="isSubmittingInputSignal() || contactFormSignal().invalid()"
        [content]="'Envoyer'"
        [submitting]="isSubmittingInputSignal()"
      />
    </div>
  </form>
</section>
