<div class="error-404">
  <mat-card class="card" appearance="outlined">
    <mat-card-content class="content">
      <div class="eyebrow">
        <mat-icon aria-hidden="true">search_off</mat-icon>
        <span>Erreur 404</span>
      </div>

      <div class="code">404</div>
      <h1 class="title">{{ titleInputSignal() }}</h1>
      <p class="message">{{ messageInputSignal() }}</p>

      <div class="actions">
        <button
          mat-flat-button
          type="button"
          back-home
          [label]="homeLabelInputSignal()"
          [route]="homeRouteInputSignal()"
        ></button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
