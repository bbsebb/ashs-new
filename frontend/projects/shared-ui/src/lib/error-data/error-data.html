<mat-card class="error-card" appearance="outlined">
  <mat-card-content class="content">
    <div class="header">
      <mat-icon aria-hidden="true" class="error-icon">error_outline</mat-icon>

      <div class="texts">
        <h2 class="title">Impossible de charger {{ dataName() || 'la donnée' }}</h2>
        <p class="subtitle">
          Une erreur est survenue pendant le chargement. Vérifiez votre connexion et réessayez.
        </p>
      </div>
    </div>

    <div class="message" role="alert" aria-live="polite">
      <strong>{{ dataName() || 'La donnée' }}</strong>
      n’a pas pu être chargée.
      <span class="message-muted">Si le problème persiste, réessayez dans quelques minutes.</span>
    </div>

    <div class="actions">
      <button mat-flat-button type="button" (click)="onRetry.emit()">
        <mat-icon aria-hidden="true">refresh</mat-icon>
        Réessayer
      </button>


      <button mat-button type="button" back-home>

      </button>

    </div>
  </mat-card-content>
</mat-card>
