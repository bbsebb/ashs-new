@let viewModel = hallCardViewModelInputSignal();
<!-- Hall Card Container -->
<mat-card appearance="outlined" class="card">
  <!-- Map Section -->
  <div class="map-container">
    <iframe
      mat-card-image
      class="map-iframe"
      [src]="viewModel.googleMapsEmbedUrl | safe"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      title="Localisation Google Maps">
    </iframe>
  </div>

  <!-- Header Section with Title and Action -->
  <mat-card-header class="header">
    <mat-card-title class="title">{{ viewModel.name }}</mat-card-title>
    <span class="spacer"></span>
    <a
      mat-icon-button
      [href]="viewModel.googleMapsUrl"
      target="_blank"
      rel="noopener noreferrer"
      [matTooltip]="'Ouvrir dans Google Maps'"
      aria-label="Ouvrir dans Google Maps"
    >
      <mat-icon>open_in_new</mat-icon>
    </a>
  </mat-card-header>

  <!-- Content Section with Address Info -->
  <mat-card-content class="content">
    <div class="info-container">
      <div class="info-item">
        <div class="row">
          <mat-icon class="icon" aria-hidden="true">location_on</mat-icon>
          <div class="text">
            <span class="info-label">Adresse</span>
            <span class="info-value">{{ viewModel.addressStreet }}</span>
            <span class="info-value">{{ viewModel.addressCityInfo }}</span>
            <span class="info-value">{{ viewModel.addressCountry }}</span>
          </div>
        </div>
      </div>
    </div>
  </mat-card-content>

  <mat-divider></mat-divider>

  <!-- Actions Slot -->
  <mat-card-actions align="end" class="actions">
    <ng-content select="[actions]"></ng-content>
  </mat-card-actions>
</mat-card>
