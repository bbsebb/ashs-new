<mat-toolbar class="toolbar">
  <button mat-icon-button class="example-icon" aria-label="Menu">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="example-spacer"></span>

  <a routerLink="/" class="logo-container">
    <img [ngSrc]="'shared-ui/logo.svg'"
         width="631"
         height="733"
         alt="Logo"
         class="logo-img"
         priority>
  </a>

  <span class="example-spacer"></span>

  <button mat-icon-button class="example-icon favorite-icon" aria-label="Favoris">
    <mat-icon>favorite</mat-icon>
  </button>
  <button mat-icon-button class="example-icon" aria-label="Partager">
    <mat-icon>share</mat-icon>
  </button>
</mat-toolbar>
