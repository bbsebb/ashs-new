<mat-toolbar class="toolbar">

  <menu class="left-menu">
    <ng-content select="[left-menu]"></ng-content>
  </menu>
  <span class="example-spacer"></span>

  <a routerLink="/" class="logo-container">
    <img [ngSrc]="'/shared-ui/logo.svg'"
         width="631"
         height="733"
         alt="Logo"
         class="logo-img"
         priority>
  </a>

  <span class="example-spacer"></span>
  <menu class="right-menu">
    <ng-content select="[right-menu]"></ng-content>
  </menu>

</mat-toolbar>
