<app-header class="header">
  <ng-container ngProjectAs="[left-menu]">
    <ng-content select="[left-menu]"></ng-content>
  </ng-container>
  <ng-container ngProjectAs="[right-menu]">
    <ng-content select="[right-menu]"></ng-content>
  </ng-container>
</app-header>

<div class="app-body">
  @if (!isHandsetSignal()) {
    <nav app-nav-rail></nav>
  }


  <main #content class="content" [class.mobile-mode]="isHandsetSignal()">
    <router-outlet></router-outlet>
    <app-footer class="footer"></app-footer>
  </main>

  @if (isHandsetSignal()) {
    <nav app-bottom-bar></nav>
  }
</div>
