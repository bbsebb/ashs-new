<!-- Navigation items container -->
  <div class="rail-container">
    <!-- Loop through all menu items defined in configuration -->
    @for (item of menuItems(); track item.label) {
      <a class="nav-item" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '' || item.path === '/' }" matRipple>
        <mat-icon>{{ item.icon }}</mat-icon>
        <span class="label">{{ item.label }}</span>
      </a>
    }
  </div>
