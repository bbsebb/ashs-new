@let viewModel = staffMiniCardViewModelInputSignal();
<a [routerLink]="['/staffs', viewModel.id]" class="staff-mini-card" title="Voir la fiche de l'encadrant">
  <div class="avatar-container">
    @if (viewModel.avatarUrl) {
      <img [ngSrc]="viewModel.avatarUrl" [alt]="viewModel.fullName" width="32" height="32"
           class="avatar">
    } @else {
      <div class="avatar-placeholder">
        <mat-icon>person</mat-icon>
      </div>
    }
  </div>
  <div class="staff-details">
    <span class="full-name">{{ viewModel.fullName }}</span>
    <span class="role">{{ viewModel.roleLabel }}</span>
  </div>
  <mat-icon class="chevron">chevron_right</mat-icon>
</a>
