<a [routerLink]="['/staffs', staffIdSignal()]" class="staff-mini-card" title="Voir la fiche de l'encadrant">
  <div class="avatar-container">
    @if (avatarSignal()) {
      <img [ngSrc]="createImageSourceUrl(avatarSignal())" [alt]="fullNameSignal()" width="32" height="32"
           class="avatar">
    } @else {
      <div class="avatar-placeholder">
        <mat-icon>person</mat-icon>
      </div>
    }
  </div>
  <div class="staff-details">
    <span class="full-name">{{ fullNameSignal() }}</span>
    <span class="role">{{ roleSignal() }}</span>
  </div>
  <mat-icon class="chevron">chevron_right</mat-icon>
</a>
