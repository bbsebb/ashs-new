<a [routerLink]="['/staffs', staffIdInputSignal()]" class="staff-mini-card" title="Voir la fiche de l'encadrant">
  <div class="avatar-container">
    @if (avatarInputSignal()) {
      <img [ngSrc]="createImageSourceUrl(avatarInputSignal())" [alt]="fullNameInputSignal()" width="32" height="32"
           class="avatar">
    } @else {
      <div class="avatar-placeholder">
        <mat-icon>person</mat-icon>
      </div>
    }
  </div>
  <div class="staff-details">
    <span class="full-name">{{ fullNameInputSignal() }}</span>
    <span class="role">{{ roleInputSignal() }}</span>
  </div>
  <mat-icon class="chevron">chevron_right</mat-icon>
</a>
