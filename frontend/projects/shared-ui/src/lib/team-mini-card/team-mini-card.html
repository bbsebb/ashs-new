@let viewModel = teamMiniCardViewModelInputSignal();

<!-- Mini Card Link Container -->
<a [routerLink]="['/teams', viewModel.id]" class="team-mini-card" title="Voir les détails de l'équipe">
  <!-- Team Name and Category Details -->
  <div class="team-details">
    <span class="category-name">
      {{ viewModel.categoryAndNumberLabel }}
    </span>
    <span class="gender-label">{{ viewModel.genderLabel }}</span>
  </div>

  <!-- Navigation Indicator -->
  <mat-icon class="chevron">chevron_right</mat-icon>
</a>
