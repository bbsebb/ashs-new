<a [routerLink]="['/halls', hallIdInputSignal()]" class="session-item" title="Voir les détails de la salle">
  <div class="session-day">{{ dayOfWeekInputSignal() | dayOfWeek }}</div>
  <div class="session-details">
    <span class="session-time">
      {{ startTimeInputSignal() | date: 'HH:mm' }} - {{ endTimeInputSignal() | date: 'HH:mm' }}
    </span>
    <span class="session-hall">
      <mat-icon>location_on</mat-icon>
      {{ hallNameInputSignal() }}
    </span>
  </div>
  <mat-icon class="chevron">chevron_right</mat-icon>
</a>
