@let viewModel = trainingSessionViewModelInputSignal();
<a [routerLink]="['/halls', viewModel.hallId]" class="session-item" title="Voir les détails de la salle">
  <div class="session-day">{{ viewModel.dayOfWeek | dayOfWeek }}</div>
  <div class="session-details">
    <span class="session-time">
      {{ viewModel.startTime | date: 'HH:mm' }} - {{ viewModel.endTime | date: 'HH:mm' }}
    </span>
    <span class="session-hall">
      <mat-icon>location_on</mat-icon>
      {{ viewModel.hallName }}
    </span>
  </div>
  <mat-icon class="chevron">chevron_right</mat-icon>
</a>
