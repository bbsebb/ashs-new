<a [routerLink]="['/halls', hallId()]" class="session-item" title="Voir les détails de la salle">
  <div class="session-day">{{ dayOfWeek() | dayOfWeek }}</div>
  <div class="session-details">
    <span class="session-time">
      {{ startTime() | date: 'HH:mm' }} - {{ endTime() | date: 'HH:mm' }}
    </span>
    <span class="session-hall">
      <mat-icon>location_on</mat-icon>
      {{ hallName() }}
    </span>
  </div>
  <mat-icon class="chevron">chevron_right</mat-icon>
</a>
