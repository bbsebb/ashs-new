<a [routerLink]="['/halls', hallIdSignal()]" class="session-item" title="Voir les détails de la salle">
  <div class="session-day">{{ dayOfWeekSignal() | dayOfWeek }}</div>
  <div class="session-details">
    <span class="session-time">
      {{ startTimeSignal() | date: 'HH:mm' }} - {{ endTimeSignal() | date: 'HH:mm' }}
    </span>
    <span class="session-hall">
      <mat-icon>location_on</mat-icon>
      {{ hallNameSignal() }}
    </span>
  </div>
  <mat-icon class="chevron">chevron_right</mat-icon>
</a>
