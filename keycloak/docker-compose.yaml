services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: dev-keycloak
    # La commande 'start-dev' lance Keycloak optimisé pour le développement (sans HTTPS obligatoire)
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # Options pour lier Keycloak à la base de données Postgres ci-dessous (optionnel en dev, mais recommandé)
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres_db:5432/keycloakdb
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak_pass
    ports:
      - "8081:8080" # Accessible sur http://localhost:8081
    depends_on:
      - postgres_db
    networks:
      - dev-network

  # --- BASE DE DONNÉES ---
  postgres_db:
    image: postgres:latest
    container_name: dev-postgres
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak_pass
      - POSTGRES_DB=keycloakdb
    ports:
      - "5433:5432" # Accessible sur localhost:5432 pour Spring Boot ou DBeaver/pgAdmin
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - dev-network

# --- VOLUMES ET RÉSEAUX ---
volumes:
  postgres_data: # Permet de ne pas perdre vos données si vous coupez le conteneur

networks:
  dev-network:
    driver: bridge