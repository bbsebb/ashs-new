services:
  # 1. La BDD démarre en premier
  db:
    image: postgres:latest
    container_name: postgres-db-staging
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ashs_db
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - db-data-staging:/var/lib/postgresql
    networks:
      - staging-ashs-network
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2. Le Backend démarre UNIQUEMENT quand la BDD est "healthy"
  app:
    image: ghcr.io/bbsebb/ashs-new:${IMAGE_TAG}
    container_name: spring-app-staging
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - PAGE_ACCESS_TOKEN=${PAGE_ACCESS_TOKEN}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - SUMUP_API_KEY=${SUMUP_API_KEY}
      - SUMUP_MERCHANT_CODE=${SUMUP_MERCHANT_CODE}
      - SUMUP_RETURN_URL=${SUMUP_RETURN_URL}
      - SUMUP_REDIRECT_URL=${SUMUP_REDIRECT_URL}
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8079/realms/ashs
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/ashs/protocol/openid-connect/certs
    volumes:
      - ./uploads:/app/uploads
    networks:
      - staging-ashs-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Utilisation de wget à la place de curl. 
      # --spider vérifie juste que l'URL répond sans télécharger le fichier.
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s # Laisse 60s à Spring pour s'initialiser

  # 3. Les frontends démarrent UNIQUEMENT quand le Backend est "healthy"
  frontend-app:
    image: ghcr.io/bbsebb/ashs-new-frontend-app:${IMAGE_TAG}
    container_name: angular-app-staging
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - staging-ashs-network
    depends_on:
      app:
        condition: service_healthy

  frontend-admin:
    image: ghcr.io/bbsebb/ashs-new-frontend-admin:${IMAGE_TAG}
    container_name: angular-admin-staging
    restart: unless-stopped
    ports:
      - "8082:80"
    networks:
      - staging-ashs-network
    depends_on:
      app:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: staging-keycloak
    # La commande 'start-dev' lance Keycloak optimisé pour le développement (sans HTTPS obligatoire)
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # Options pour lier Keycloak à la base de données Postgres ci-dessous (optionnel en dev, mais recommandé)
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://staging_postgres_db:5432/keycloakdb
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak_pass
      # Configuration du thème personnalisé
      - KC_THEME_DEFAULT=ashs
      # URL publique pour l'issuer
      - KC_HOSTNAME_URL=http://localhost:8079
      - KC_HOSTNAME_STRICT=false
    ports:
      - "8079:8080" # Accessible sur http://localhost:8079
    volumes:
      - ./theme/ashs:/opt/keycloak/themes/ashs:z
    depends_on:
      - staging_postgres_db
    networks:
      - staging-ashs-network

  # --- BASE DE DONNÉES ---
  staging_postgres_db:
    image: postgres:latest
    container_name: staging-postgres
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak_pass
      - POSTGRES_DB=keycloakdb
    ports:
      - "5433:5432" # Accessible sur localhost:5432 pour Spring Boot ou DBeaver/pgAdmin
    volumes:
      - db_kc_staging:/var/lib/postgresql
    networks:
      - staging-ashs-network




# Définition de l'infrastructure Docker
networks:
  staging-ashs-network:
    driver: bridge

volumes:
  db_kc_staging:
    name: keycloak_db_staging
  db-data-staging:
    name: ashs_db_data_staging